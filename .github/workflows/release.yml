name: Release gem

on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Publish gem and create GitHub release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ruby
          bundler-cache: true
      - name: Validate release and build gem
        run: bundle exec rake release:notes build
      - name: Publish to RubyGems.org
        uses: rubygems/release-gem@v1
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v$(bundle exec ruby -Ilib -rsidekiq/lock/version -e 'print Sidekiq::Lock::VERSION')" --verify-tag --title "v$(bundle exec ruby -Ilib -rsidekiq/lock/version -e 'print Sidekiq::Lock::VERSION')" --notes-file pkg/release-notes.md
